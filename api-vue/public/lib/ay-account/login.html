<!doctype html>
<html lang="zh-CN" data-theme="auto" data-mode="full">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>AyAccount</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="./header-title.css?v=3.2.2" />
    <link rel="stylesheet" href="./toast.css?v=3.2.2" />
    <link rel="stylesheet" href="./login.css?v=3.2.2" />
    <script defer src="./header-title.js?v=3.2.2"></script>
    <script type="module">
        "use strict";

        const version = "3.2.2";
        const useMin = new URLSearchParams(location.search).get("min") === "1";
        try {
            await import(
                useMin
                    ? `./login.min.js?v=${version}`
                    : `./login.js?v=${version}`
            );
        } catch (error) {
            if (useMin) {
                await import(`./login.js?v=${version}`);
            } else {
                console.error("[AyAccount] login script failed:", error);
            }
        }
    </script>
</head>

<body>
    <div class="app" id="app">
        <main class="ay-card" id="card" data-page="login" aria-label="AyAccount">
            <button type="button" class="ay-close" id="closeBtn" aria-label="关闭" data-i18n-aria="common.close">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>

            <header class="brand">
                <div class="card-header" aria-hidden="true">
                    <span class="card-header-title">A</span>
                    <span class="card-header-title">y</span>
                    <span class="card-header-title">A</span>
                    <span class="card-header-title">c</span>
                    <span class="card-header-title">c</span>
                    <span class="card-header-title">o</span>
                    <span class="card-header-title">u</span>
                    <span class="card-header-title">n</span>
                    <span class="card-header-title">t</span>
                </div>
            </header>

            <div class="tabs" id="tabs" data-active="login" role="tablist" aria-label="AyAccount">
                <span class="tabs__indicator" aria-hidden="true"></span>
                <button type="button" class="tab" id="tabLogin" role="tab" aria-selected="true"
                    aria-controls="page-login" data-page="login" data-i18n="nav.login.plain">登录</button>
                <button type="button" class="tab" id="tabRegister" role="tab" aria-selected="false"
                    aria-controls="page-register" data-page="register" data-i18n="nav.reg.plain">注册</button>
            </div>

            <div class="stage" id="stage">
                <!-- ================= login ================= -->
                <section class="page is-active" id="page-login" data-page="login" role="tabpanel"
                    aria-labelledby="tabLogin">
                    <form class="form" id="loginForm" novalidate autocomplete="on">
                        <p class="page-subtitle" data-i18n="subtitle.account">使用你的 AyAccount</p>

                        <div class="field">
                            <div class="field__control">
                                <input class="field__input" id="loginAccount" name="username" type="text"
                                    autocomplete="username" autocapitalize="off" spellcheck="false" placeholder=" "
                                    aria-describedby="loginAccountError" />
                                <label class="field__label" for="loginAccount"
                                    data-i18n="login.usernameoremail">用户名/邮箱</label>
                            </div>
                            <p class="field__error" id="loginAccountError" aria-live="polite" hidden></p>
                        </div>

                        <div class="field">
                            <div class="field__control">
                                <input class="field__input" id="loginPassword" name="password" type="password"
                                    autocomplete="current-password" placeholder=" "
                                    aria-describedby="loginPasswordError" />
                                <label class="field__label" for="loginPassword" data-i18n="login.password">密码</label>
                            </div>
                            <p class="field__error" id="loginPasswordError" aria-live="polite" hidden></p>
                        </div>

                        <div class="agreement" id="loginAgreement" role="checkbox" tabindex="0" aria-checked="false">
                            <span class="agreement__box" aria-hidden="true">
                                <svg viewBox="0 0 18 18" fill="none">
                                    <path class="agreement__check" d="M4 9.3L7.3 12.6L14 5.7" pathLength="1" />
                                </svg>
                            </span>
                            <span class="agreement__text">
                                <span data-i18n="agreement.prefix">我已阅读并同意</span>
                                <a href="https://undz.cn/privacy_policy/zh-cn.html" target="_blank" rel="noopener"
                                    data-i18n="privacy_policy" data-i18n-href="privacy_policy.link">《隐私政策》</a>
                                <span data-i18n="agreement.and1">和</span>
                                <a href="https://undz.cn/terms/zh-cn.html" target="_blank" rel="noopener"
                                    data-i18n="terms" data-i18n-href="terms.link">《服务条款》</a>
                            </span>
                        </div>
                        <p class="field__error" id="loginAgreementError" aria-live="polite" hidden></p>

                        <button type="submit" class="btn btn--primary" id="loginSubmit">
                            <span class="spinner" id="loginSpinner" hidden aria-hidden="true"></span>
                            <span data-i18n="btn.login">登录</span>
                        </button>

                        <button type="button" class="oauth-expand" id="oauthExpand">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            <span data-i18n="oauth.expand">展开第三方登录</span>
                        </button>
                    </form>
                </section>

                <!-- ================= register ================= -->
                <section class="page" id="page-register" data-page="register" role="tabpanel"
                    aria-labelledby="tabRegister">
                    <form class="form" id="registerForm" novalidate autocomplete="on">
                        <p class="page-subtitle" data-i18n="register.subtitle">创建你的 AyAccount</p>

                        <div class="field">
                            <div class="field__control">
                                <input class="field__input" id="regUsername" name="username" type="text"
                                    autocomplete="username" autocapitalize="off" spellcheck="false" placeholder=" "
                                    aria-describedby="regUsernameError" />
                                <label class="field__label" for="regUsername" data-i18n="reg.username">用户名</label>
                            </div>
                            <p class="field__error" id="regUsernameError" aria-live="polite" hidden></p>
                        </div>

                        <div class="field">
                            <div class="field__control">
                                <input class="field__input" id="regEmail" name="email" type="email" autocomplete="email"
                                    placeholder=" " aria-describedby="regEmailError" />
                                <label class="field__label" for="regEmail" data-i18n="reg.email">邮箱</label>
                            </div>
                            <p class="field__error" id="regEmailError" aria-live="polite" hidden></p>
                        </div>

                        <div class="field">
                            <div class="field__control">
                                <input class="field__input" id="regPassword" name="password" type="password"
                                    autocomplete="new-password" placeholder=" "
                                    aria-describedby="regPasswordError" />
                                <label class="field__label" for="regPassword" data-i18n="reg.password">密码</label>
                            </div>
                            <p class="field__error" id="regPasswordError" aria-live="polite" hidden></p>
                        </div>

                        <div class="field">
                            <div class="field__control">
                                <input class="field__input" id="regPasswordConfirm" name="passwordConfirm"
                                    type="password" autocomplete="off" placeholder=" "
                                    aria-describedby="regPasswordConfirmError" />
                                <label class="field__label" for="regPasswordConfirm"
                                    data-i18n="reg.passwordConfirm">请再次输入密码</label>
                            </div>
                            <p class="field__error" id="regPasswordConfirmError" aria-live="polite" hidden></p>
                        </div>

                        <div class="agreement" id="registerAgreement" role="checkbox" tabindex="0" aria-checked="false">
                            <span class="agreement__box" aria-hidden="true">
                                <svg viewBox="0 0 18 18" fill="none">
                                    <path class="agreement__check" d="M4 9.3L7.3 12.6L14 5.7" pathLength="1" />
                                </svg>
                            </span>
                            <span class="agreement__text">
                                <span data-i18n="agreement.prefix">我已阅读并同意</span>
                                <a href="https://undz.cn/privacy_policy/zh-cn.html" target="_blank" rel="noopener"
                                    data-i18n="privacy_policy" data-i18n-href="privacy_policy.link">《隐私政策》</a>
                                <span data-i18n="agreement.and1">和</span>
                                <a href="https://undz.cn/terms/zh-cn.html" target="_blank" rel="noopener"
                                    data-i18n="terms" data-i18n-href="terms.link">《服务条款》</a>
                            </span>
                        </div>
                        <p class="field__error" id="registerAgreementError" aria-live="polite" hidden></p>

                        <button type="submit" class="btn btn--primary" id="registerSubmit">
                            <span class="spinner" id="registerSpinner" hidden aria-hidden="true"></span>
                            <span data-i18n="btn.reg">注册</span>
                        </button>

                        <button type="button" class="btn btn--text" id="toLogin">
                            <span data-i18n="common.have_account_login">已有账号？去登录</span>
                        </button>
                    </form>
                </section>

                <!-- ================= traditional email verification ================= -->
                <section class="page" id="page-email" data-page="email" role="region" aria-label="验证邮箱">
                    <div class="verify-page">
                        <p class="page-subtitle" data-i18n="verify.email.title">验证邮箱</p>
                        <p class="verify-desc">
                            <span data-i18n="verify.email.sent">验证码已发送至</span>
                            <strong class="verify-target" id="emailVerifyTarget"></strong>
                        </p>

                        <form class="form" id="emailVerifyForm" novalidate>
                            <div class="field">
                                <div class="field__row">
                                    <div class="field__control">
                                        <input class="field__input" id="emailVerifyCode" name="code" type="text"
                                            inputmode="numeric" autocomplete="one-time-code" autocapitalize="off"
                                            maxlength="6" placeholder=" " aria-describedby="emailVerifyCodeError" />
                                        <label class="field__label" for="emailVerifyCode"
                                            data-i18n="reg.emailCode">验证码</label>
                                    </div>
                                    <button type="button" class="code-btn" id="emailCountdownBtn" disabled>60s</button>
                                </div>
                                <p class="field__error" id="emailVerifyCodeError" aria-live="polite" hidden></p>
                            </div>

                            <button type="submit" class="btn btn--primary" id="emailVerifySubmit">
                                <span class="spinner" id="emailVerifySpinner" hidden aria-hidden="true"></span>
                                <span data-i18n="verify.submit">完成注册</span>
                            </button>

                            <button type="button" class="btn btn--primary" id="emailVerifyBack"
                                data-i18n="verify.back">返回修改</button>
                        </form>
                    </div>
                </section>

                <!-- ================= reverse email verification ================= -->
                <section class="page" id="page-reverse" data-page="reverse" role="region" aria-label="验证邮箱">
                    <div class="verify-page">
                        <p class="page-subtitle" data-i18n="verify.reverse.title">验证邮箱</p>
                        <p class="verify-desc" data-i18n="verify.reverse.desc">
                            请用注册邮箱向下面的地址发送一封邮件，正文填写验证码（主题随意）。
                        </p>

                        <div class="verify-info">
                            <div class="verify-info__row">
                                <span class="verify-info__label" data-i18n="verify.address">收件地址</span>
                                <code class="verify-info__value" id="reverseAddress"></code>
                                <button type="button" class="verify-copy" id="reverseCopyAddress"
                                    data-i18n="common.copy">复制</button>
                            </div>
                            <div class="verify-info__row">
                                <span class="verify-info__label" data-i18n="verify.code">邮件正文</span>
                                <code class="verify-info__value verify-info__value--code" id="reverseCode"></code>
                                <button type="button" class="verify-copy" id="reverseCopyCode"
                                    data-i18n="common.copy">复制</button>
                            </div>
                        </div>

                        <a class="verify-mailto" id="reverseMailto" href="#">
                            <span data-i18n="verify.mailto">使用邮件客户端发送</span>
                        </a>

                        <div class="verify-status" id="reverseStatus" aria-live="polite">
                            <span data-i18n="verify.waiting">等待邮件…</span>
                        </div>
                        <p class="md-hint" id="reverseCountdown"></p>

                        <div class="verify-actions">
                            <button type="button" class="btn btn--primary" id="reverseBack"
                                data-i18n="verify.back">返回修改</button>
                        </div>
                    </div>
                </section>

                <!-- ================= third-party ================= -->
                <section class="page" id="page-oauth" data-page="oauth" role="region" aria-label="第三方账号登录">
                    <div class="oauth-page">
                        <h1 class="oauth-page__title" data-i18n="oauth.title">第三方账号登录</h1>
                        <p class="oauth-page__desc" data-i18n="oauth.description">使用第三方账号登录或注册 AyAccount。</p>

                        <div class="provider-list">
                            <button type="button" class="provider" id="oauthYzhyzxy" data-provider="yzhyzxy">
                                <span class="provider__logo provider__logo--yzhyzxy" aria-hidden="true">
                                    <svg viewBox="0 0 28 28" fill="none">
                                        <rect width="28" height="28" rx="6" fill="#0b0b0d" />
                                        <path d="M8 9L14 15L20 9M14 15V20" stroke="#ffffff" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                </span>
                                <span class="provider__text">
                                    <span class="provider__name" data-i18n="oauth.yzhyzxy.name">Yzhyzxy</span>
                                    <span class="provider__hint" data-i18n="oauth.yzhyzxy.hint">使用 Yzhyzxy 账号继续</span>
                                </span>
                            </button>

                            <button type="button" class="provider" id="oauthGithub" data-provider="github">
                                <span class="provider__logo provider__logo--github" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="currentColor">
                                        <path
                                            d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.77.12 3.06.74.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.4-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z" />
                                    </svg>
                                </span>
                                <span class="provider__text">
                                    <span class="provider__name" data-i18n="oauth.github.name">GitHub</span>
                                    <span class="provider__hint" data-i18n="oauth.github.hint">使用 GitHub 账号继续</span>
                                </span>
                            </button>
                        </div>

                        <button type="button" class="btn btn--ghost" id="oauthBack">
                            <span data-i18n="oauth.back">返回账号登录</span>
                        </button>
                    </div>
                </section>
            </div>

            <footer class="footer">
                <a href="javascript:void(0)" id="faqLink" data-i18n="btn.haveQuestion">遇到问题</a>
            </footer>
        </main>
    </div>

    <div role="dialog" tabindex="0" class="ay-popup ay-toast" id="toast" style="display: none" aria-live="polite">
        <i class="ay-icon">
            <img class="ay-icon__image ay-icon__image--loading" src="./toast-loading.svg" alt="" />
        </i>
        <i class="ay-icon">
            <img class="ay-icon__image ay-icon__image--error" src="./toast-error.svg" alt="" style="display: none" />
        </i>
        <div class="ay-toast__text">加载中...</div>
    </div>
</body>

</html>
