<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组件预览中心 - AyAccount</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Helvetica Neue", "Lucida Grande", "Roboto", "Ebrima", "Nirmala UI", "Gadugi", "Segoe Xbox Symbol", "Segoe UI Symbol", "Meiryo UI", "Khmer UI", "Tunga", "Lao UI", "Raavi", "Iskoola Pota", "Latha", "Leelawadee", "Microsoft YaHei UI", "Microsoft JhengHei UI", "Malgun Gothic", "Estrangelo Edessa", "Microsoft Himalaya", "Microsoft New Tai Lue", "Microsoft PhagsPa", "Microsoft Tai Le", "Microsoft Yi Baiti", "Mongolian Baiti", "MV Boli", "Myanmar Text", "Cambria Math";
        }

        body {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768"><rect width="1366" height="768" fill="%23000000"/><g fill="%23FFFFFF"><path fill-opacity="0.0392" d="M 1029.4 357.5 L 1366 759.1 L 1366 0 L 1137.7 0 Z"/><path fill-opacity="0.1569" d="M 1138.1 0 L 993.3 768 L 1366 768 L 1366 244 C 1290.7 121.6 1219.2 41.1 1178.7 0 Z"/><path fill-opacity="0.2000" d="M 949.8 768 c 92.6 -170.6 213 -440.3 269.4 -768 L 585 0 L 587.1 766 Z"/><path fill-opacity="0.2588" d="M 1175.6 768 C 1123.6 563.3 1027.4 275.2 856.2 0 L 476.4 0 L 471.1 768 Z"/><path fill-opacity="0.3569" d="M 777.5 768 C 661.9 348.8 427.2 21.4 401.2 25.4 L 323.1 768 Z"/><path fill-opacity="0.4392" d="M 178.44 766.86 L 308.7 768 C 381.7 604.6 481.6 344.3 562.2 0 L 0 0 Z"/><path fill-opacity="0.5098" d="M 146 0 L 0 0 L 0 768 L 394.2 768 C 327.7 475.3 228.5 201 146 0 Z"/></g><rect width="1366" height="768" fill="%234285F4" fill-opacity="0.8"/></svg>');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: 14.6% 22.8%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1b1b1b;
            padding: 20px;
        }

        .card {
            background-color: #fff;
            border-radius: 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            width: 440px;
            max-width: calc(100% - 40px);
            min-width: 320px;
            padding: 44px;
            animation: fadeIn .3s ease-in;
        }

        .pageTitle {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 16px;
            margin-bottom: 12px;
        }

        .pageDescription {
            font-size: 15px;
            line-height: 1.25rem;
            font-weight: 400;
            margin-bottom: 24px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 0 24px;
            height: 36px;
            font-size: 15px;
            font-weight: 400;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
        }

        .btn-primary {
            background: #0067b8;
            color: #fff;
        }

        .btn-primary:hover {
            background: #005da6;
        }

        .btn-secondary {
            background: rgba(0, 0, 0, 0.1);
            color: #1b1b1b;
        }

        .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.15);
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            body {
                background-image: none;
                background-color: #fff;
                align-items: flex-start;
                padding: 0;
            }

            .card {
                width: 100vw;
                max-width: 100vw;
                min-height: 100vh;
                padding: 24px;
                margin: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="pageTitle">组件预览</div>
        <p class="pageDescription">请选择需要查看的组件演示页面。</p>
        <div class="links">
            <a href="progress.html" class="btn btn-primary">进度条组件 (Progress)</a>
            <a href="slide.html" class="btn btn-secondary">页面滑动切换 (Slide)</a>
        </div>
    </div>
</body>

</html>
