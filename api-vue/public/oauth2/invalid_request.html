<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授权请求无效 - AyOauth2Center</title>
    <style>
        @import url('https://cdn.undz.cn/npm/typeface-roboto@1.1.13/index.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F4F2F9;
            display: flex;
            justify-content: center;
            color-scheme: light;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .md3-card {
            background: #FEF7FF;
            border-radius: 28px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05), 0 12px 24px rgba(103, 80, 164, 0.10);
            max-width: 520px;
            width: 100%;
            padding: 48px 40px 32px;
            text-align: center;
            border: 1px solid #EADDF2;
        }

        .md3-icon-wrapper {
            width: 80px;
            height: 80px;
            background: #F6EDFF;
            border-radius: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
        }

        .md3-icon-wrapper svg {
            width: 48px;
            height: 48px;
        }

        .md3-title {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.2px;
            color: #1D1B20;
            margin-bottom: 8px;
        }

        .md3-subtitle {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.25px;
            line-height: 1.6;
            color: #49454F;
            margin-bottom: 24px;
        }

        .md3-detail-box {
            background: #F3EDF7;
            border-radius: 16px;
            padding: 16px 20px;
            text-align: left;
            margin-bottom: 28px;
            border: 1px solid #EADDF2;
        }

        .md3-detail-box p {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.8;
            color: #1D1B20;
            margin: 0;
        }

        .md3-detail-box strong {
            color: #6750A4;
            font-weight: 500;
        }

        .md3-detail-box code {
            background: #E6E0E9;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            color: #21005D;
            font-family: 'Roboto Mono', monospace;
        }

        .md3-roles {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
            text-align: left;
        }

        .md3-role-item {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            background: #FBF8FE;
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid #E6E0E9;
            transition: background 0.1s ease;
        }

        .md3-role-item:hover {
            background: #F6EDFF;
        }

        .md3-role-icon {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            background: #E8DEF8;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .md3-role-icon svg {
            width: 22px;
            height: 22px;
            fill: #6750A4;
        }

        .md3-role-content {
            flex: 1;
        }

        .md3-role-label {
            font-size: 13px;
            font-weight: 500;
            color: #1D1B20;
            letter-spacing: 0.3px;
            display: block;
            margin-bottom: 4px;
        }

        .md3-role-desc {
            font-size: 13px;
            font-weight: 400;
            line-height: 1.5;
            color: #49454F;
            margin: 0;
        }

        .md3-role-desc code {
            background: #E6E0E9;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 12px;
            color: #21005D;
            font-family: 'Roboto Mono', monospace;
        }

        .md3-btn {
            background: #6750A4;
            color: #FFFFFF;
            border: none;
            padding: 12px 32px;
            border-radius: 100px;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .md3-btn:hover {
            background: #4F378A;
            box-shadow: 0 2px 6px rgba(103, 80, 164, 0.3);
        }

        .md3-footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #EADDF2;
            font-size: 13px;
            color: #79747E;
            letter-spacing: 0.25px;
        }

        .md3-footer a {
            color: #6750A4;
            text-decoration: none;
            font-weight: 500;
        }

        .md3-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="md3-card">
        <div class="md3-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM13 17H11V15H13V17ZM13 13H11V7H13V13Z"
                    fill="#B3261E" />
            </svg>
        </div>
        <h1 class="md3-title">授权请求参数无效</h1>
        <p class="md3-subtitle">第三方应用发起的授权请求缺少必要参数，或参数格式不符合 OAuth 标准。</p>

        <div class="md3-detail-box">
            <p>
                <strong>可能的原因：</strong><br>
                · 缺少 <code>client_id</code>（应用唯一标识）<br>
                · 缺少 <code>redirect_uri</code>（授权后回调地址）<br>
                · <code>response_type</code> 参数值错误
            </p>
        </div>

        <div class="md3-roles">
            <div class="md3-role-item">
                <div class="md3-role-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z" />
                    </svg>
                </div>
                <div class="md3-role-content">
                    <span class="md3-role-label">如果您是 应用开发者</span>
                    <p class="md3-role-desc">
                        请检查授权请求的 URL 参数，确保 <code>client_id</code>、<code>redirect_uri</code> 完整传递。
                    </p>
                </div>
            </div>
            <div class="md3-role-item">
                <div class="md3-role-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                    </svg>
                </div>
                <div class="md3-role-content">
                    <span class="md3-role-label">如果您是 普通用户</span>
                    <p class="md3-role-desc">
                        您正在使用的第三方应用发起的授权请求格式不正确，请返回上一步重试，或联系该应用的技术支持人员。
                    </p>
                </div>
            </div>
        </div>

        <a href="javascript:history.back()" class="md3-btn">重试</a>
        <!-- 因为是302过来的，所以直接back就行 -->
        <!-- <div class="md3-footer">
            持续遇到问题？请联系 <a href="mailto:aeyundian@foxmail.com">平台管理员</a>
        </div> -->
    </div>
</body>

</html>
