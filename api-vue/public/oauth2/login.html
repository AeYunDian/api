<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AyOauth2Center</title>
    <script src="/lib/account-sdk.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #f4f2f9;
            display: flex;
            justify-content: center;
            color-scheme: light;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: rgba(255, 255, 255, 0.85);
        }

        .md3-card {
            background: #FEF7FF;
            border-radius: 28px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05), 0 12px 24px rgba(103, 80, 164, 0.10);
            max-width: 520px;
            width: 100%;
            padding: 48px 40px 32px;
            text-align: center;
            border: 1px solid #EADDF2;
        }

        .md3-title {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.2px;
            color: #1D1B20;
            margin-bottom: 8px;
        }

        .md3-subtitle {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.25px;
            line-height: 1.6;
            color: #49454F;
            margin-bottom: 24px;
        }

        .md3-icon-wrapper svg {
            width: 48px;
            height: 48px;
        }

        .md3-btn {
            background: #6750A4;
            color: #FFFFFF;
            border: none;
            padding: 12px 32px;
            border-radius: 100px;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .md3-btn:hover {
            background: #4F378A;
            box-shadow: 0 2px 6px rgba(103, 80, 164, 0.3);
        }

        .fade-out {
            animation: indicator-fade-out 0.25s;
        }

        @keyframes indicator-fade-out {
            0% {
                transform: scaleY(1);
                opacity: 1;

            }

            100% {
                transform: scaleY(0);
                opacity: 0.3;
            }
        }
    </style>
</head>

<body>
    <div class="md3-card">
        <div class="md3-icon-wrapper loading-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="#EADDF2" stroke-width="2.5" fill="none" />
                <circle cx="12" cy="12" r="10" stroke="#6750A4" stroke-width="2.5" fill="none" stroke-linecap="round"
                    stroke-dasharray="30 80">
                    <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s"
                        repeatCount="indefinite" />
                </circle>
            </svg>
        </div>
        <div class="md3-icon-wrapper error-icon" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"
                    fill="#6750A4" />
            </svg>
        </div>
        <h1 class="md3-title">加载中...</h1>
        <p class="md3-subtitle">正在加载资源</p>
        <a href="javascript:window.location.reload();" class="md3-btn" style="display: none;">重试</a>
    </div>
    <script>
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get('redirect_url');
            const targetUrl = redirectUrl || '/oauth2/unknown_address?countdown=0x2710';
            const subtitle = document.querySelector(".md3-subtitle");
            const card = document.querySelector(".md3-card");
            const loadingIcon = document.querySelector(".loading-icon");
            const errorIcon = document.querySelector(".error-icon");
            const btn = document.querySelector(".md3-btn");
            const title = document.querySelector(".md3-title");
            let account = null;
            if (!subtitle || !card || !loadingIcon || !errorIcon || !btn) return;

            function showError(text) {
                title.innerHTML = '出错啦！';
                subtitle.innerHTML = text;
                card.style.display = '';
                btn.style.display = '';
                errorIcon.style.display = '';
                loadingIcon.style.display = 'none';
            }

            function waitForDependencies(timeout = 10000) {
                return new Promise((resolve, reject) => {
                    const start = Date.now();
                    const check = () => {
                        const geetestReady = typeof initGeetest4 !== 'undefined';
                        const toastReady = typeof AyShowResult !== 'undefined' && typeof AyCloseToast !== 'undefined';
                        if (geetestReady && toastReady) {
                            document.body.style.backgroundColor = "#fff";
                            card.classList.add("fade-out");
                            setTimeout(() => { card.style.display = 'none'; }, 250);
                            resolve();
                            return;
                        }
                        if (Date.now() - start > timeout) {
                            reject(new Error('依赖加载超时，请检查网络'));
                            return;
                        }
                        setTimeout(check, 200);
                    };
                    check();
                });
            }

            /**
             * 检查登录状态，如果未登录则尝试刷新令牌，再检查一次
             * @returns {Promise<{ loggedIn: boolean, user?: Object }>}
             */
            async function checkAuthWithRefresh(account) {
                try {
                    const verifyResult = await account.verify();
                    if (verifyResult) {
                        if (verifyResult.valid) {
                            return { loggedIn: true, user: verifyResult.user };
                        }
                        if (verifyResult.banned || verifyResult.error_code === 1017) {
                            await account.logout();
                            return { loggedIn: false };
                        }
                    }
                } catch (err) {
                }

                // 第一次验证失败（未登录或 token 过期），尝试刷新
                try {
                    await account.refresh();
                    const retryVerifyResult = await account.verify();
                    if (retryVerifyResult && retryVerifyResult.valid) {
                        return { loggedIn: true, user: retryVerifyResult.user };
                    }
                } catch (refreshErr) {
                    console.debug('刷新失败', refreshErr.message);
                }
                return { loggedIn: false };
            }

            async function main() {
                try {
                    await waitForDependencies();

                    account = createAyAccount({
                        appId: 'oauth2',
                        i18n: 'zh-cn'
                    });

                    const authCheck = await checkAuthWithRefresh(account);
                    if (authCheck.loggedIn) {
                        title.innerHTML = '登录成功';
                        subtitle.innerHTML = '正在等待服务器响应...';
                        card.style.display = '';
                        btn.style.display = 'none';
                        errorIcon.style.display = 'none';
                        loadingIcon.style.display = 'none';
                        window.location.href = targetUrl;
                        return;
                    }
                    const loginPromise = account.login({ hideOauthClient: true, hideClose: true });
                    const result = await loginPromise;
                    document.body.style.backgroundColor = "";
                    card.classList.remove("fade-out");
                    if (result && result.action === 'login') {
                        title.innerHTML = '登录成功';
                        subtitle.innerHTML = '正在等待服务器响应...';
                        card.style.display = '';
                        btn.style.display = 'none';
                        errorIcon.style.display = 'none';
                        loadingIcon.style.display = 'none';
                        window.location.href = targetUrl;
                    } else {
                        showError('登录返回非预期结果');
                    }
                } catch (error) {
                    console.error('登录流程异常:', error);
                    showError(error.message || '登录初始化失败，请刷新页面重试');
                }
            }
            main();
        })();
    </script>
</body>

</html>
