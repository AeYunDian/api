<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱不支持 - AyAccount</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #F4F2F9;
            color-scheme: light;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #FEF7FF;
            border-radius: 24px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05), 0 12px 24px rgba(103, 80, 164, 0.10);
            max-width: 460px;
            width: 100%;
            padding: 36px 32px 28px;
            border: 1px solid #EADDF2;
            text-align: center;
        }

        .icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: #FCE8E6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #B3261E;
            font-size: 28px;
            font-weight: 600;
        }

        h1 {
            font-size: 22px;
            font-weight: 500;
            color: #1D1B20;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 13px;
            line-height: 1.7;
            color: #49454F;
            margin-bottom: 18px;
        }

        .detail {
            background: #F3EDF7;
            border: 1px solid #EADDF2;
            border-radius: 14px;
            padding: 14px 16px;
            text-align: left;
            margin-bottom: 22px;
        }

        .detail p {
            font-size: 12px;
            line-height: 1.8;
            color: #49454F;
            word-break: break-all;
        }

        .detail strong {
            color: #1D1B20;
            font-weight: 500;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 100px;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            background: #6750A4;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #4F378A;
        }

        .hint {
            margin-top: 14px;
            font-size: 11px;
            line-height: 1.6;
            color: #79747E;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">!</div>
        <h1>该邮箱暂不支持注册</h1>
        <p class="desc">
            第三方账号返回的邮箱不在 AyAccount 的支持范围内，无法直接创建账号。
            你可以换一个支持的邮箱注册，或使用已有 AyAccount 登录后在账号设置中绑定。
        </p>
        <div class="detail">
            <p><strong>登录方式：</strong><span id="providerName">-</span></p>
            <p><strong>返回邮箱：</strong><span id="emailValue">-</span></p>
        </div>
        <button type="button" id="closeBtn">关闭窗口</button>
        <p class="hint">如需帮助，请前往 online.undz.cn 登录已有账号后绑定。</p>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var provider = params.get('provider') || '';
            var email = params.get('email') || '';
            var names = {
                github: 'GitHub',
                yzhyzxy: 'Yzhyzxy',
                google: 'Google',
                cloudflare: 'Cloudflare',
                jihulab: '极狐 GitLab',
                facebook: 'Facebook',
                discord: 'Discord',
                aliyun: '阿里云'
            };
            document.getElementById('providerName').textContent = names[provider] || provider || '第三方账号';
            document.getElementById('emailValue').textContent = email || '未返回';

            function close() {
                try {
                    if (window.opener) {
                        window.opener.postMessage({
                            action: 'login_fail',
                            provider: provider,
                            message: '该邮箱不在支持范围内'
                        }, '*');
                    }
                } catch (e) { }
                window.close();
            }

            document.getElementById('closeBtn').addEventListener('click', close);
        })();
    </script>
</body>

</html>
