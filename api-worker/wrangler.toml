name = "ay-api"
compatibility_date = "2026-06-29"
main = "src/index.js"
keep_vars = true
compatibility_flags = ["nodejs_compat"]

kv_namespaces = [
  { binding = "kv", id = "483f0fad0c2841a2888c72869e041dfd" }
]

[ai]
binding = "AI"

[[ratelimits]]
name = "limiter"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 50
  period = 10

[assets]
binding = "assets"
directory = "../api-assets"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[d1_databases]]
binding = "db" 
database_name = "api_db" 
database_id = "aa999f5d-188b-4fe7-83be-24ec7d521060" 

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

[triggers]
crons = ["*/30 * * * *"]
