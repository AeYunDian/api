<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组件预览中心 - AyAccount</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Helvetica Neue", "Lucida Grande", "Roboto", "Ebrima", "Nirmala UI", "Gadugi", "Segoe Xbox Symbol", "Segoe UI Symbol", "Meiryo UI", "Khmer UI", "Tunga", "Lao UI", "Raavi", "Iskoola Pota", "Latha", "Leelawadee", "Microsoft YaHei UI", "Microsoft JhengHei UI", "Malgun Gothic", "Estrangelo Edessa", "Microsoft Himalaya", "Microsoft New Tai Lue", "Microsoft PhagsPa", "Microsoft Tai Le", "Microsoft Yi Baiti", "Mongolian Baiti", "MV Boli", "Myanmar Text", "Cambria Math";
        }

        body {
            background-color: #f4f2f9;
            background-image: url("./background_eae2dd7e.svg");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1b1b1b;
            padding: 20px;
        }

        .card {
            background-color: #fff;
            border-radius: 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            width: 440px;
            max-width: calc(100% - 40px);
            min-width: 320px;
            padding: 44px;
            animation: fadeIn .3s ease-in;
        }

        .pageTitle {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 16px;
            margin-bottom: 12px;
        }

        .pageDescription {
            font-size: 15px;
            line-height: 1.25rem;
            font-weight: 400;
            margin-bottom: 24px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 0 24px;
            height: 36px;
            font-size: 15px;
            font-weight: 400;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
        }

        .btn-primary {
            background: #0067b8;
            color: #fff;
        }

        .btn-primary:hover {
            background: #005da6;
        }

        .btn-secondary {
            background: rgba(0, 0, 0, 0.1);
            color: #1b1b1b;
        }

        .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.15);
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            body {
                background-image: none;
                background-color: #fff;
                align-items: flex-start;
                padding: 0;
            }

            .card {
                width: 100vw;
                max-width: 100vw;
                min-height: 100vh;
                padding: 24px;
                margin: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="pageTitle">组件预览</div>
        <p class="pageDescription">请选择需要查看的组件演示页面。</p>
        <div class="links">
            <a href="progress.html" class="btn btn-primary">进度条组件 (Progress)</a>
            <a href="slide.html" class="btn btn-secondary">页面滑动切换 (Slide)</a>
        </div>
    </div>
</body>

</html>
