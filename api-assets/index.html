    <style>
        .ant-progress-bar {
            z-index: 10000;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            overflow: hidden;
        }

        .ant-progress-bar>div {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #0067b8;
            opacity: 0;
            animation: progressDot 2s infinite;
        }

        .ant-progress-bar>div:nth-child(1) {
            animation-delay: 0.05s;
        }

        .ant-progress-bar>div:nth-child(2) {
            animation-delay: 0.2s;
        }

        .ant-progress-bar>div:nth-child(3) {
            animation-delay: 0.35s;
        }

        .ant-progress-bar>div:nth-child(4) {
            animation-delay: 0.5s;
        }

        .ant-progress-bar>div:nth-child(5) {
            animation-delay: 0.65s;
        }

        @keyframes progressDot {

            0%,
            20% {
                left: 0;
                opacity: 0;
                animation-timing-function: ease-out;
            }

            25% {
                opacity: 1;
            }

            35% {
                left: 45%;
                animation-timing-function: linear;
            }

            65% {
                left: 60%;
                animation-timing-function: ease-in;
            }

            75% {
                opacity: 1;
            }

            80%,
            100% {
                left: 100%;
                opacity: 0;
            }
        }
    </style>

    </div>

    <div id="website"></div>

    <script>
        (function () {
            function supportsModule() {
                if (window.HTMLScriptElement && HTMLScriptElement.supports) {
                    return HTMLScriptElement.supports('module');
                }
                return 'noModule' in document.createElement('script');
            }

            var supported = (
                typeof Proxy !== 'undefined' &&
                typeof Promise !== 'undefined' &&
                typeof Symbol !== 'undefined' &&
                supportsModule()
            );

            if (!supported) {
                var fallback = document.getElementById('browser-fallback');
                if (fallback) fallback.style.display = 'block';
                var app = document.getElementById('website');
                if (app) app.style.display = 'none';

                var bar = document.getElementById('ant-progress-bar');
                if (bar) bar.style.display = 'none';
                var domain = window.location.hostname || window.location.host || window.location.href.split('/')[2];
                var tiptitle = "浏览器版本过低";
                if (domain) {
                    tiptitle = tiptitle + " - " + domain;
                }
                document.title = tiptitle;
            }
        })();
    </script>
