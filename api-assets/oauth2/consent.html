<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>授权确认 - AyOauth2Center</title>
    <style>
        @import url('https://cdn.undz.cn/npm/typeface-roboto@1.1.13/index.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #F4F2F9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .md3-card {
            background: #FEF7FF;
            border-radius: 28px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05), 0 12px 24px rgba(103, 80, 164, 0.10);
            max-width: 720px;
            width: 100%;
            padding: 32px 32px 24px;
            border: 1px solid #EADDF2;
            transition: padding 0.2s;
        }

        /* ===== 左右布局容器 ===== */
        .consent-container {
            display: flex;
            flex-direction: column;
            /* 移动端默认垂直 */
            gap: 24px;
        }

        /* ===== 左侧 ===== */
        .consent-left {
            flex: 0 0 auto;
            text-align: center;
        }

        .consent-left .md3-icon-wrapper {
            width: 72px;
            height: 72px;
            background: #F6EDFF;
            border-radius: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 16px;
        }

        .consent-left .md3-icon-wrapper svg {
            width: 40px;
            height: 40px;
        }

        .consent-left .md3-title {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.2px;
            color: #1D1B20;
            margin-bottom: 4px;
        }

        .consent-left .md3-subtitle {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.25px;
            line-height: 1.5;
            color: #49454F;
        }

        .consent-left .md3-subtitle strong {
            color: #1D1B20;
            font-weight: 500;
        }

        .user-info {
            margin-top: 12px;
            font-size: 13px;
            color: #49454F;
            background: #F3EDF7;
            border-radius: 12px;
            padding: 10px 16px;
            display: inline-block;
            border: 1px solid #EADDF2;
        }

        .user-info span {
            font-weight: 500;
            color: #1D1B20;
        }

        /* ===== 右侧 ===== */
        .consent-right {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .scope-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .scope-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #E6E0E9;
            font-size: 14px;
            color: #1D1B20;
        }

        .scope-list li:last-child {
            border-bottom: none;
        }

        .scope-icon {
            width: 24px;
            text-align: center;
            font-size: 18px;
        }

        .scope-desc {
            flex: 1;
        }

        .app-info {
            font-size: 13px;
            color: #49454F;
        }

        .app-info .label {
            color: #6750A4;
            font-weight: 500;
        }

        /* ===== 按钮组 ===== */
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: auto;
            /* 推到容器底部 */
            padding-top: 12px;
            border-top: 1px solid #EADDF2;
        }

        .btn {
            padding: 10px 28px;
            border-radius: 100px;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: none;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #6750A4;
            color: #FFFFFF;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .btn-primary:hover {
            background: #4F378A;
            box-shadow: 0 2px 6px rgba(103, 80, 164, 0.3);
        }

        .btn-secondary {
            background: #E6E0E9;
            color: #1D1B20;
        }

        .btn-secondary:hover {
            background: #D0C9D6;
        }

        /* ===== 加载/错误状态 ===== */
        .loading,
        .error-msg {
            text-align: center;
            padding: 40px 0;
            color: #79747E;
        }

        .error-msg {
            color: #B3261E;
            display: none;
        }

        /* ============================================ */
        /* ===== 桌面端：左右布局 ===== */
        @media (min-width: 768px) {
            .md3-card {
                padding: 40px 40px 32px;
                max-width: 800px;
            }

            .consent-container {
                flex-direction: row;
                gap: 40px;
                align-items: stretch;
            }

            .consent-left {
                flex: 0 0 40%;
                text-align: left;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding-right: 20px;
                border-right: 1px solid #EADDF2;
            }

            .consent-left .md3-icon-wrapper {
                margin: 0 0 16px 0;
            }

            .consent-left .md3-title {
                font-size: 28px;
            }

            .consent-left .user-info {
                display: inline-block;
                width: auto;
                margin-top: 16px;
            }

            .consent-right {
                flex: 1;
                gap: 16px;
            }

            .btn-group {
                padding-top: 16px;
            }
        }

        /* 小屏手机额外调整 */
        @media (max-width: 400px) {
            .md3-card {
                padding: 20px 16px 16px;
            }

            .btn {
                padding: 8px 20px;
                font-size: 13px;
            }

            .btn-group {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="md3-card">
        <div id="loading" class="loading">加载中...</div>
        <div id="error" class="error-msg"></div>

        <div id="content" style="display: none;">
            <div class="consent-container">
                <!-- ===== 左侧 ===== -->
                <div class="consent-left">
                    <div class="md3-icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
                                fill="#6750A4" />
                        </svg>
                    </div>
                    <h1 class="md3-title">授权确认</h1>
                    <p class="md3-subtitle">
                        应用 <strong id="appName">加载中...</strong> 请求以下权限
                    </p>
                    <div class="user-info">
                        当前登录：<span id="userDisplay">-</span>
                    </div>
                </div>

                <!-- ===== 右侧 ===== -->
                <div class="consent-right">
                    <div class="app-info">
                        <span class="label">应用名称：</span><span id="clientName">-</span>
                        &nbsp;·&nbsp; <span class="label">权限范围：</span><span id="scopeDescription">-</span>
                    </div>

                    <ul class="scope-list" id="scopeList">
                        <!-- 由 JS 动态渲染 -->
                    </ul>

                    <form id="consentForm" method="POST" action="/api/oauth/consent">
                        <input type="hidden" name="client_id" id="client_id">
                        <input type="hidden" name="redirect_uri" id="redirect_uri">
                        <input type="hidden" name="scope" id="scope">
                        <input type="hidden" name="state" id="state">
                        <div class="btn-group">
                            <button type="submit" name="action" value="deny" class="btn btn-secondary">拒绝</button>
                            <button type="submit" name="action" value="allow" class="btn btn-primary">允许</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const clientId = params.get('client_id');
            const redirectUri = params.get('redirect_uri');
            const scope = params.get('scope') || 'openid profile email';
            const state = params.get('state') || '';

            const content = document.getElementById('content');
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');

            const appName = document.getElementById('appName');
            const clientName = document.getElementById('clientName');
            const scopeDescription = document.getElementById('scopeDescription');
            const userDisplay = document.getElementById('userDisplay');
            const scopeList = document.getElementById('scopeList');

            // 填充隐藏字段
            document.getElementById('client_id').value = clientId;
            document.getElementById('redirect_uri').value = redirectUri;
            document.getElementById('scope').value = scope;
            document.getElementById('state').value = state;

            // 权限描述映射
            const scopeMap = {
                'openid': 'OpenID 身份标识',
                'profile': '查看您的用户名',
                'email': '查看您的邮箱地址',
                'offline_access': '允许离线刷新令牌'
            };

            function renderScopes(scopeStr) {
                const scopes = scopeStr.split(/\s+/).filter(s => s);
                if (scopes.length === 0) {
                    scopeList.innerHTML = '<li style="border:none;color:#79747E;">无权限请求</li>';
                    scopeDescription.textContent = '无';
                    return;
                }
                const listHtml = scopes.map(s => {
                    const icon = scopeMap[s] ? scopeMap[s].split(' ')[0] : '📌';
                    const desc = scopeMap[s] ? scopeMap[s].replace(/^[^\s]+\s/, '') : s;
                    return `<li><span class="scope-icon">${icon}</span><span class="scope-desc">${desc}</span></li>`;
                }).join('');
                scopeList.innerHTML = listHtml;
                scopeDescription.textContent = scopes.join(', ');
            }

            async function loadData() {
                try {
                    // 1. 获取当前登录用户
                    const verifyRes = await fetch('/api/ayonline/verify', { credentials: 'include' });
                    if (!verifyRes.ok) {
                        throw new Error('未登录，请先登录');
                    }
                    const verifyData = await verifyRes.json();
                    if (!verifyData.valid) {
                        throw new Error(verifyData.error || '未登录');
                    }
                    userDisplay.textContent = verifyData.user.username + ' (' + verifyData.user.email + ')';

                    // 2. 获取客户端信息
                    const clientRes = await fetch('/api/oauth/client-info?client_id=' + encodeURIComponent(clientId));
                    if (!clientRes.ok) {
                        throw new Error('无法获取应用信息');
                    }
                    const clientData = await clientRes.json();
                    appName.textContent = clientData.name;
                    clientName.textContent = clientData.name;

                    // 3. 渲染权限列表
                    renderScopes(scope);

                    // 显示内容
                    loading.style.display = 'none';
                    content.style.display = 'block';
                } catch (err) {
                    loading.style.display = 'none';
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = '❌ ' + err.message;
                    // 如果未登录，3秒后跳转到登录页
                    if (err.message.includes('未登录')) {
                        const loginUrl = '/oauth2/login?redirect_url=' + encodeURIComponent(window.location.href);
                        setTimeout(() => { window.location.href = loginUrl; }, 2000);
                    }
                }
            }

            loadData();
        })();
    </script>
</body>

</html>
