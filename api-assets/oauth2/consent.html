<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授权确认 - AyOauth2Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f2f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #FEF7FF;
            border-radius: 28px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05), 0 12px 24px rgba(103, 80, 164, 0.10);
            max-width: 820px;
            width: 100%;
            padding: 48px 40px 32px;
            border: 1px solid #EADDF2;
            display: flex;
            flex-direction: row;
            gap: 40px;
        }

        .left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left h1 {
            font-size: 28px;
            font-weight: 500;
            color: #1D1B20;
            margin-bottom: 12px;
        }

        .left p {
            font-size: 16px;
            color: #49454F;
            line-height: 1.6;
        }

        .right {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #FBF8FE;
            border-radius: 20px;
            padding: 24px 28px;
            border: 1px solid #E6E0E9;
        }

        .right .scope-list {
            list-style: none;
            padding: 0;
            margin: 0 0 24px 0;
        }

        .right .scope-list li {
            padding: 10px 0;
            border-bottom: 1px solid #EADDF2;
            font-size: 15px;
            color: #1D1B20;
            display: flex;
            align-items: center;
        }

        .right .scope-list li::before {
            content: "✓";
            color: #6750A4;
            font-weight: bold;
            margin-right: 12px;
        }

        .right .scope-list li:last-child {
            border-bottom: none;
        }

        .actions {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .btn {
            padding: 10px 32px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            background: transparent;
        }

        .btn-primary {
            background: #6750A4;
            color: #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .btn-primary:hover {
            background: #4F378A;
            box-shadow: 0 2px 6px rgba(103, 80, 164, 0.3);
        }

        .btn-secondary {
            color: #6750A4;
            border: 1px solid #6750A4;
        }

        .btn-secondary:hover {
            background: #F6EDFF;
        }

        /* 移动端适配 */
        @media (max-width: 640px) {
            .container {
                flex-direction: column;
                padding: 32px 24px;
                gap: 24px;
            }

            .left h1 {
                font-size: 24px;
            }

            .right {
                padding: 20px;
            }

            .actions {
                justify-content: center;
            }

            .btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left">
            <h1>授权确认</h1>
            <p>应用 <strong>%APP_NAME%</strong> 请求以下权限：</p>
        </div>
        <div class="right">
            <ul class="scope-list">
                %SCOPE_LIST%
            </ul>
        </div>
        <div class="actions">
            <a href="/api/oauth/authorize?action=deny&client_id=%CLIENT_ID%&redirect_uri=%REDIRECT_URI%&state=%STATE%&scope=%SCOPE%"
                class="btn btn-secondary">拒绝</a>
            <a href="/api/oauth/authorize?action=approve&client_id=%CLIENT_ID%&redirect_uri=%REDIRECT_URI%&state=%STATE%&scope=%SCOPE%"
                class="btn btn-primary">同意</a>
        </div>
    </div>
</body>

</html>
