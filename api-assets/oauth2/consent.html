<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授权确认 - AyAccount</title>
    <link rel="stylesheet" type="text/css" href="./header-title.css" />
    <script defer src="./header-title.js"></script>
    <style>
        /* ===== 基础重置与微软系字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Helvetica Neue", "Lucida Grande", "Roboto", "Ebrima", "Nirmala UI", "Gadugi", "Segoe Xbox Symbol", "Segoe UI Symbol", "Meiryo UI", "Khmer UI", "Tunga", "Lao UI", "Raavi", "Iskoola Pota", "Latha", "Leelawadee", "Microsoft YaHei UI", "Microsoft JhengHei UI", "Malgun Gothic", "Estrangelo Edessa", "Microsoft Himalaya", "Microsoft New Tai Lue", "Microsoft PhagsPa", "Microsoft Tai Le", "Microsoft Yi Baiti", "Mongolian Baiti", "MV Boli", "Myanmar Text", "Cambria Math";
        }

        p {
            font-size: 15px;
            line-height: 1.25rem;
            font-weight: 400;
            color: #1b1b1b;
        }

        body {
            overflow: hidden;
            background: #f4f2f9;
            display: flex;
            justify-content: center;
            color-scheme: light;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: url("./background_eae2dd7e.svg");
            background-size: cover;
            background-position: center;
        }

        /* ===== 进度条 ===== */
        .progress {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            overflow: hidden;
            transition: opacity 0.3s;
        }

        .progress>div {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #0067b8;
            opacity: 0;
            animation: progressDot 2s infinite;
        }

        .progress>div:nth-child(1) {
            animation-delay: .05s;
        }

        .progress>div:nth-child(2) {
            animation-delay: .20s;
        }

        .progress>div:nth-child(3) {
            animation-delay: .35s;
        }

        .progress>div:nth-child(4) {
            animation-delay: .50s;
        }

        .progress>div:nth-child(5) {
            animation-delay: .65s;
        }

        @keyframes progressDot {

            0%,
            20% {
                left: 0;
                opacity: 0;
                animation-timing-function: ease-out;
            }

            25% {
                opacity: 1;
            }

            35% {
                left: 45%;
                animation-timing-function: linear;
            }

            65% {
                left: 60%;
                animation-timing-function: ease-in;
            }

            75% {
                opacity: 1;
            }

            80%,
            100% {
                left: 100%;
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .progress>div {
                animation: none;
                opacity: .6;
                left: 0;
                width: 100%;
                height: 5px;
                border-radius: 0;
            }
        }

        /* ===== 卡片容器 ===== */
        .card {
            animation: fadeIn .3s ease-in;
            position: relative;
            max-width: calc(100% - 40px);
            width: 440px;
            padding: 44px;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            min-width: 320px;
            overflow: hidden;
        }

        .pageTitle {
            color: #1b1b1b;
            font-size: 1.5rem;
            font-weight: 600;
            padding: 0;
            margin-top: 16px;
            margin-bottom: 12px;
        }

        .pageDescription {
            margin-bottom: 12px;
            margin-top: 0;
        }

        /* ===== 滑动容器 ===== */
        .pagination-view {
            position: relative;
            overflow: hidden;
            will-change: transform, opacity;
        }

        /* 默认隐藏所有页面，使用 display: none 避免留白 */
        .pagination-view>div {
            display: none;
        }

        /* 滑动进入动画 */
        .pagination-view>div.slide-in-next {
            animation: show-from-right 0.25s cubic-bezier(0.5, 0, 0.5, 1) both;
        }

        .pagination-view>div.slide-in-back {
            animation: show-from-left 0.25s cubic-bezier(0.5, 0, 0.5, 1) both;
        }

        @keyframes show-from-right {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes show-from-left {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .pagination-view>div.slide-in-next,
            .pagination-view>div.slide-in-back {
                animation: none;
            }
        }

        /* ===== Step2 授权内容样式 ===== */
        .scope-list {
            list-style: none;
            padding: 0;
            margin: 16px 0 24px 0;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .scope-list li {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            font-size: 15px;
            color: #1b1b1b;
            display: flex;
            align-items: center;
            background: #fbfbfb;
        }

        .scope-list li::before {
            content: "•";
            font-size: 20px;
            color: #0067b8;
            font-weight: bold;
            margin-right: 12px;
            line-height: 1;
        }

        .scope-list li:last-child {
            border-bottom: none;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .btn {
            padding: 0 24px;
            height: 36px;
            font-size: 15px;
            font-weight: 400;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.2s;
            min-width: 96px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            word-break: keep-all;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-primary {
            background: #0067b8;
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: #005da6;
        }

        .btn-secondary {
            background: rgba(0, 0, 0, 0.1);
            color: #1b1b1b;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(0, 0, 0, 0.15);
        }

        .error-msg {
            color: #e81123;
            font-size: 15px;
            margin-top: 12px;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        /* ===== 移动端适配 ===== */
        @media (max-width: 600px) {
            body {
                background-image: none;
                background-color: #fff;
                align-items: flex-start;
            }

            .card {
                width: 100vw;
                max-width: 100vw;
                min-height: 100vh;
                min-height: 100dvh;
                padding: 24px;
                margin: 0;
                border-radius: 0;
                box-shadow: none;
            }

            .actions {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
                height: 40px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="progress" role="progressbar">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>

        <div class="header">
            <span class="header-title">A</span>
            <span class="header-title">y</span>
            <span class="header-title">A</span>
            <span class="header-title">c</span>
            <span class="header-title">c</span>
            <span class="header-title">o</span>
            <span class="header-title">u</span>
            <span class="header-title">n</span>
            <span class="header-title">t</span>
        </div>

        <div class="pagination-view">
            <!-- 第一页：加载中 -->
            <div class="step1">
                <div class="pageTitle">授权</div>
                <p class="pageDescription">正在获取信息...</p>
            </div>

            <!-- 第二页：授权确认 -->
            <div class="step2">
                <div class="pageTitle">授权确认</div>
                <p class="pageDescription">应用 <strong id="appName">未知</strong> 请求获取以下信息：</p>
                <div id="errorMsg" class="error-msg"></div>
                <ul class="scope-list" id="scopeList"></ul>
                <div class="actions" id="actionButtons">
                    <button id="denyBtn" class="btn btn-secondary">拒绝</button>
                    <button id="approveBtn" class="btn btn-primary">同意</button>
                </div>
            </div>

            <!-- 第三页：等待响应 -->
            <div class="step3">
                <div class="pageTitle" id="step3Title">已授权</div>
                <p class="pageDescription">正在等待服务器响应...</p>
            </div>

            <!-- 第四页：错误 -->
            <div class="errorPage">
                <div class="pageTitle" id="errorTitle">出错啦！</div>
                <p class="pageDescription" id="errorDesc"></p>
                <div class="actions" style="margin-top: 24px;">
                    <button id="reloadBtn" class="btn btn-primary">重新加载</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const $ = (sel, ctx = document) => ctx.querySelector(sel);
        const urlParams = new URLSearchParams(window.location.search);
        const requestId = urlParams.get('request_id');

        const pages = {
            s1: $("div.step1"),
            s2: $("div.step2"),
            s3: $("div.step3"),
            errorPage: $("div.errorPage")
        };

        const elProgress = $(".progress");
        const elErrorTitle = $("#errorTitle");
        const elErrorDesc = $("#errorDesc");

        let currentPage = null;

        function applyMode(target) {
            // 只有在第一页和第三页时显示进度条，第二页和错误页隐藏
            elProgress.style.display = (target === "s1" || target === "s3") ? "block" : "none";
        }

        function changePage(target, direction = "next") {
            if (!pages[target]) {
                showError("无法切换至目标页面，请重试");
                return;
            }
            if (target === currentPage) return;

            // 隐藏所有并清除动画
            Object.keys(pages).forEach((key) => {
                pages[key].style.display = "none";
                pages[key].classList.remove("slide-in-next", "slide-in-back");
            });

            // 显示目标并应用动画
            const activeEl = pages[target];
            activeEl.style.display = "block";
            void activeEl.offsetWidth; // 触发重绘以应用动画
            activeEl.classList.add(direction === "back" ? "slide-in-back" : "slide-in-next");

            applyMode(target);
            currentPage = target;
        }

        function showError(text, title = "出错啦！") {
            elErrorTitle.textContent = title;
            elErrorDesc.textContent = text;
            changePage("errorPage");
        }

        const scopeMap = {
            'openid': '获取您的身份标识 (OpenID)',
            'profile': '获取您的个人资料 (昵称、头像等)',
            'email': '获取您的电子邮箱地址',
            'phone': '获取您的手机号码',
            'address': '获取您的地址信息',
        };

        function getScopeDescription(scope) {
            return scopeMap[scope] || scope;
        }

        async function fetchConsentData() {
            const res = await fetch('//online.undz.cn/api/oauth/consent-data?request_id=' + encodeURIComponent(requestId), {
                credentials: 'include'
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || '获取授权信息失败');
            }
            return res.json();
        }

        let consentToken = '';
        const approveBtn = document.getElementById('approveBtn');
        const denyBtn = document.getElementById('denyBtn');
        const actionButtons = document.getElementById('actionButtons');

        function disableButtons() {
            approveBtn.disabled = true;
            denyBtn.disabled = true;
        }

        function enableButtons() {
            approveBtn.disabled = false;
            denyBtn.disabled = false;
        }

        async function handleAction(isApprove) {
            disableButtons();
            actionButtons.style.display = "none";

            // 切换到第三页
            $("#step3Title").textContent = isApprove ? "已授权" : "已取消授权";
            changePage("s3");

            const endpoint = isApprove ? '/api/oauth/consent/approve' : '/api/oauth/consent/deny';
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ request_id: requestId, consent_token: consentToken }),
                    credentials: 'include'
                });
                const data = await res.json();
                if (data.redirect_url) {
                    window.location.href = data.redirect_url;
                } else {
                    showError(data.error || (isApprove ? '授权失败，请重试' : '拒绝失败，请重试'));
                }
            } catch (err) {
                showError('网络错误，请重试');
            }
        }

        document.getElementById('reloadBtn').addEventListener('click', function () {
            window.location.href = window.location.href + (window.location.href.includes('?') ? '&' : '?') + '_t=' + Date.now();
        });

        // 初始化
        changePage("s1", "back");

        (function init() {
            if (!requestId) {
                showError('缺少授权请求标识，请重试。');
                return;
            }

            fetchConsentData().then(data => {
                document.getElementById('appName').textContent = data.client_name || '未知应用';
                const scopeList = document.getElementById('scopeList');
                const scopes = data.scope ? data.scope.split(' ') : [];

                if (scopes.length === 0) {
                    const li = document.createElement('li');
                    li.textContent = '（未请求任何敏感权限）';
                    scopeList.appendChild(li);
                } else {
                    scopes.forEach(s => {
                        const li = document.createElement('li');
                        li.textContent = getScopeDescription(s);
                        scopeList.appendChild(li);
                    });
                }

                consentToken = data.consent_token || '';
                approveBtn.onclick = () => handleAction(true);
                denyBtn.onclick = () => handleAction(false);
                enableButtons();

                // 数据加载完毕，切换到第二页
                changePage("s2");
            }).catch(err => {
                showError(err.message || '加载授权信息失败');
            });
        })();
    </script>
</body>

</html>
